name: CI

# Everything the repo checks by hand (locale guardrail, pytest, node tests, Vite
# build) runs here, so "I ran it locally" is not the only evidence a PR can carry.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Locale guardrail (key parity + no hardcoded API strings)
        run: python scripts/check_i18n.py --scan
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Node regression tests (auth token, language header, locale audit)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
